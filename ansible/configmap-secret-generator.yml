---
# ConfigMap and Secret Generator from Environment Files
# Reads .env files and creates ConfigMaps and Secrets in the target namespace.
# Sensitive keys (containing PASSWORD, SECRET, TOKEN, KEY, API) become Secrets.
#
# Usage:
#   ansible-playbook configmap-secret-generator.yml -e "env_file=.env namespace=dev"
#   ansible-playbook configmap-secret-generator.yml -e "env_file=.env.prod namespace=prod app_name=myapp"

- name: Generate ConfigMaps and Secrets from environment files
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    env_file: ".env"
    namespace: "default"
    app_name: "app"
    sensitive_patterns:
      - PASSWORD
      - SECRET
      - TOKEN
      - KEY
      - API_KEY
      - PRIVATE
      - CREDENTIAL

  tasks:
    - name: Check env file exists
      ansible.builtin.stat:
        path: "{{ env_file }}"
      register: env_stat

    - name: Fail if env file not found
      ansible.builtin.fail:
        msg: "Environment file '{{ env_file }}' does not exist"
      when: not env_stat.stat.exists

    - name: Read environment file
      ansible.builtin.slurp:
        src: "{{ env_file }}"
      register: env_content

    - name: Parse environment variables
      ansible.builtin.set_fact:
        all_vars: >-
          {{
            (env_content.content | b64decode).split('\n')
            | reject('match', '^\s*#')
            | reject('match', '^\s*$')
            | map('regex_replace', '^\s+|\s+$', '')
            | list
          }}

    - name: Build key-value pairs
      ansible.builtin.set_fact:
        env_pairs: >-
          {{
            dict(
              all_vars
              | map('split', '=', 1)
              | list
            )
          }}

    - name: Separate config vars from secret vars
      ansible.builtin.set_fact:
        config_vars: >-
          {{
            env_pairs
            | dict2items
            | rejectattr('key', 'search', sensitive_patterns | join('|'))
            | items2dict
          }}
        secret_vars: >-
          {{
            env_pairs
            | dict2items
            | selectattr('key', 'search', sensitive_patterns | join('|'))
            | items2dict
          }}

    - name: Display classification summary
      ansible.builtin.debug:
        msg:
          - "ConfigMap vars ({{ config_vars | length }}): {{ config_vars.keys() | list }}"
          - "Secret vars ({{ secret_vars | length }}): {{ secret_vars.keys() | list }}"

    - name: Create ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ app_name }}-config"
            namespace: "{{ namespace }}"
            labels:
              app: "{{ app_name }}"
              managed-by: ansible
          data: "{{ config_vars }}"
      when: config_vars | length > 0

    - name: Create Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ app_name }}-secrets"
            namespace: "{{ namespace }}"
            labels:
              app: "{{ app_name }}"
              managed-by: ansible
          type: Opaque
          stringData: "{{ secret_vars }}"
      when: secret_vars | length > 0

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Created ConfigMap '{{ app_name }}-config' with {{ config_vars | length }} keys in namespace '{{ namespace }}'"
          - "Created Secret '{{ app_name }}-secrets' with {{ secret_vars | length }} keys in namespace '{{ namespace }}'"
