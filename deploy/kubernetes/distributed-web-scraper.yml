apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  labels:
    app: distributed-web-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributed-web-scraper
      component: coordinator
  template:
    metadata:
      labels:
        app: distributed-web-scraper
        component: coordinator
    spec:
      containers:
        - name: coordinator
          image: distributed-web-scraper-coordinator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_URL
              value: redis://redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-web-scraper-worker
  labels:
    app: distributed-web-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributed-web-scraper
      component: worker
  template:
    metadata:
      labels:
        app: distributed-web-scraper
        component: worker
    spec:
      containers:
        - name: worker
          image: distributed-web-scraper-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: redis://redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-web-scraper-redis
  labels:
    app: distributed-web-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributed-web-scraper
      component: redis
  template:
    metadata:
      labels:
        app: distributed-web-scraper
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  labels:
    app: distributed-web-scraper
spec:
  type: ClusterIP
  selector:
    app: distributed-web-scraper
    component: coordinator
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: distributed-web-scraper
spec:
  type: ClusterIP
  selector:
    app: distributed-web-scraper
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
