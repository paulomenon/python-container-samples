apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-jwt
  labels:
    app: auth-service-jwt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service-jwt
  template:
    metadata:
      labels:
        app: auth-service-jwt
    spec:
      containers:
        - name: auth-service-jwt
          image: auth-service-jwt:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-jwt
  labels:
    app: auth-service-jwt
spec:
  type: ClusterIP
  selector:
    app: auth-service-jwt
  ports:
    - port: 8000
      targetPort: 8000
