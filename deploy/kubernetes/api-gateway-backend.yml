apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: api-gateway-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-backend
      component: gateway
  template:
    metadata:
      labels:
        app: api-gateway-backend
        component: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: BACKEND_USERS_URL
              value: http://backend-users:8001
            - name: BACKEND_PRODUCTS_URL
              value: http://backend-products:8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-users
  labels:
    app: api-gateway-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-backend
      component: backend-users
  template:
    metadata:
      labels:
        app: api-gateway-backend
        component: backend-users
    spec:
      containers:
        - name: backend-users
          image: backend-users:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-products
  labels:
    app: api-gateway-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-backend
      component: backend-products
  template:
    metadata:
      labels:
        app: api-gateway-backend
        component: backend-products
    spec:
      containers:
        - name: backend-products
          image: backend-products:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: api-gateway-backend
spec:
  type: ClusterIP
  selector:
    app: api-gateway-backend
    component: gateway
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-users
  labels:
    app: api-gateway-backend
spec:
  type: ClusterIP
  selector:
    app: api-gateway-backend
    component: backend-users
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: backend-products
  labels:
    app: api-gateway-backend
spec:
  type: ClusterIP
  selector:
    app: api-gateway-backend
    component: backend-products
  ports:
    - port: 8002
      targetPort: 8002
