apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaling-api
  labels:
    app: autoscaling-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoscaling-api
  template:
    metadata:
      labels:
        app: autoscaling-api
    spec:
      containers:
        - name: autoscaling-api
          image: autoscaling-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: autoscaling-api
  labels:
    app: autoscaling-api
spec:
  type: ClusterIP
  selector:
    app: autoscaling-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autoscaling-api
  labels:
    app: autoscaling-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autoscaling-api
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
