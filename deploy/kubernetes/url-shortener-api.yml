apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-api
  labels:
    app: url-shortener-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-shortener-api
  template:
    metadata:
      labels:
        app: url-shortener-api
    spec:
      containers:
        - name: url-shortener-api
          image: url-shortener-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-api
  labels:
    app: url-shortener-api
spec:
  type: ClusterIP
  selector:
    app: url-shortener-api
  ports:
    - port: 5000
      targetPort: 5000
