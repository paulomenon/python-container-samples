apiVersion: v1
kind: ConfigMap
metadata:
  name: env-config-app-config
  labels:
    app: env-config-app
data:
  APP_NAME: env-config-app
  APP_ENV: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-config-app
  labels:
    app: env-config-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: env-config-app
  template:
    metadata:
      labels:
        app: env-config-app
    spec:
      containers:
        - name: env-config-app
          image: env-config-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: env-config-app-config
                  key: APP_NAME
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: env-config-app-config
                  key: APP_ENV
---
apiVersion: v1
kind: Service
metadata:
  name: env-config-app
  labels:
    app: env-config-app
spec:
  type: ClusterIP
  selector:
    app: env-config-app
  ports:
    - port: 5000
      targetPort: 5000
