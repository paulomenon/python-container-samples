apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  labels:
    app: event-driven-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-driven-system
      component: producer
  template:
    metadata:
      labels:
        app: event-driven-system
        component: producer
    spec:
      containers:
        - name: producer
          image: producer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_URL
              value: redis://redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  labels:
    app: event-driven-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-driven-system
      component: consumer
  template:
    metadata:
      labels:
        app: event-driven-system
        component: consumer
    spec:
      containers:
        - name: consumer
          image: consumer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: redis://redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-driven-system-redis
  labels:
    app: event-driven-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-driven-system
      component: redis
  template:
    metadata:
      labels:
        app: event-driven-system
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: producer
  labels:
    app: event-driven-system
spec:
  type: ClusterIP
  selector:
    app: event-driven-system
    component: producer
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: event-driven-system
spec:
  type: ClusterIP
  selector:
    app: event-driven-system
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
