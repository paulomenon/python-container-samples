apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-worker-api
  labels:
    app: task-queue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-queue-worker
      component: api
  template:
    metadata:
      labels:
        app: task-queue-worker
        component: api
    spec:
      containers:
        - name: task-queue-worker
          image: task-queue-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_URL
              value: redis://redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-worker-worker
  labels:
    app: task-queue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-queue-worker
      component: worker
  template:
    metadata:
      labels:
        app: task-queue-worker
        component: worker
    spec:
      containers:
        - name: task-queue-worker
          image: task-queue-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["rq", "worker", "--url", "redis://redis:6379"]
          env:
            - name: REDIS_URL
              value: redis://redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-worker-redis
  labels:
    app: task-queue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-queue-worker
      component: redis
  template:
    metadata:
      labels:
        app: task-queue-worker
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: task-queue-worker
  labels:
    app: task-queue-worker
spec:
  type: ClusterIP
  selector:
    app: task-queue-worker
    component: api
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: task-queue-worker
spec:
  type: ClusterIP
  selector:
    app: task-queue-worker
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
