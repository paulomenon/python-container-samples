# Deploy with:
#   oc new-project python-samples    (if needed)
#   oc apply -f task-queue-worker.yml
#   oc start-build task-queue-worker    (for each service that needs building)
#   oc get builds                    (watch build progress)
#   oc get route                     (get the URL)
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: task-queue-worker
  labels:
    app: task-queue-worker
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: task-queue-worker
  labels:
    app: task-queue-worker
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/task-queue-worker
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: task-queue-worker:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: task-queue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-queue-worker
      component: redis
  template:
    metadata:
      labels:
        app: task-queue-worker
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: task-queue-worker
spec:
  type: ClusterIP
  selector:
    app: task-queue-worker
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-worker
  labels:
    app: task-queue-worker
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"task-queue-worker:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"task-queue-worker\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-queue-worker
      component: api
  template:
    metadata:
      labels:
        app: task-queue-worker
        component: api
    spec:
      containers:
        - name: task-queue-worker
          image: task-queue-worker:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REDIS_URL
              value: redis://redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: task-queue-worker
  labels:
    app: task-queue-worker
spec:
  type: ClusterIP
  selector:
    app: task-queue-worker
    component: api
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: task-queue-worker
  labels:
    app: task-queue-worker
spec:
  to:
    kind: Service
    name: task-queue-worker
    weight: 100
  port:
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-worker-rq
  labels:
    app: task-queue-worker
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"task-queue-worker:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"task-queue-worker\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-queue-worker
      component: worker
  template:
    metadata:
      labels:
        app: task-queue-worker
        component: worker
    spec:
      containers:
        - name: task-queue-worker
          image: task-queue-worker:latest
          command:
            - rq
            - worker
            - --url
            - redis://redis:6379
          env:
            - name: REDIS_URL
              value: redis://redis:6379
