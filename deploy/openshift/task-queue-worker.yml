# Apply to your OpenShift project, for example:
#   oc project <your-namespace>
#   oc apply -f task-queue-worker.yml
# Or set metadata.namespace on each resource (uncomment and replace placeholder).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-worker
  # namespace: <your-namespace>
  labels:
    app: task-queue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-queue-worker
      component: api
  template:
    metadata:
      labels:
        app: task-queue-worker
        component: api
    spec:
      containers:
        - name: task-queue-worker
          image: task-queue-worker:latest
          ports:
            - name: http
              containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: task-queue-worker
  # namespace: <your-namespace>
  labels:
    app: task-queue-worker
spec:
  type: ClusterIP
  selector:
    app: task-queue-worker
    component: api
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: task-queue-worker
  # namespace: <your-namespace>
  labels:
    app: task-queue-worker
spec:
  to:
    kind: Service
    name: task-queue-worker
    weight: 100
  port:
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  # namespace: <your-namespace>
  labels:
    app: task-queue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-queue-worker
      component: redis
  template:
    metadata:
      labels:
        app: task-queue-worker
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  # namespace: <your-namespace>
  labels:
    app: task-queue-worker
spec:
  type: ClusterIP
  selector:
    app: task-queue-worker
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-worker-rq
  # namespace: <your-namespace>
  labels:
    app: task-queue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-queue-worker
      component: worker
  template:
    metadata:
      labels:
        app: task-queue-worker
        component: worker
    spec:
      containers:
        - name: worker
          image: task-queue-worker:latest
          command:
            - rq
            - worker
            - --url
            - redis://redis:6379
