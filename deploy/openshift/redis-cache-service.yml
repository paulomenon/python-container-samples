# Deploy with:
#   oc new-project python-samples    (if needed)
#   oc apply -f redis-cache-service.yml
#   oc start-build redis-cache-service    (for each service that needs building)
#   oc get builds                    (watch build progress)
#   oc get route                     (get the URL)
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: redis-cache-service
  labels:
    app: redis-cache-service
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: redis-cache-service
  labels:
    app: redis-cache-service
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/redis-cache-service
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: redis-cache-service:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis-cache-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache-service
      component: redis
  template:
    metadata:
      labels:
        app: redis-cache-service
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis-cache-service
spec:
  type: ClusterIP
  selector:
    app: redis-cache-service
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache-service
  labels:
    app: redis-cache-service
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"redis-cache-service:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"redis-cache-service\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache-service
      component: api
  template:
    metadata:
      labels:
        app: redis-cache-service
        component: api
    spec:
      containers:
        - name: redis-cache-service
          image: redis-cache-service:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REDIS_URL
              value: redis://redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache-service
  labels:
    app: redis-cache-service
spec:
  type: ClusterIP
  selector:
    app: redis-cache-service
    component: api
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: redis-cache-service
  labels:
    app: redis-cache-service
spec:
  to:
    kind: Service
    name: redis-cache-service
    weight: 100
  port:
    targetPort: http
