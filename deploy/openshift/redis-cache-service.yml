# Apply to your OpenShift project, for example:
#   oc project <your-namespace>
#   oc apply -f redis-cache-service.yml
# Or set metadata.namespace on each resource (uncomment and replace placeholder).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  # namespace: <your-namespace>
  labels:
    app: redis-cache-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache-service
      component: redis
  template:
    metadata:
      labels:
        app: redis-cache-service
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  # namespace: <your-namespace>
  labels:
    app: redis-cache-service
spec:
  type: ClusterIP
  selector:
    app: redis-cache-service
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache-service
  # namespace: <your-namespace>
  labels:
    app: redis-cache-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache-service
      component: api
  template:
    metadata:
      labels:
        app: redis-cache-service
        component: api
    spec:
      containers:
        - name: redis-cache-service
          image: redis-cache-service:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REDIS_URL
              value: redis://redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache-service
  # namespace: <your-namespace>
  labels:
    app: redis-cache-service
spec:
  type: ClusterIP
  selector:
    app: redis-cache-service
    component: api
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: redis-cache-service
  # namespace: <your-namespace>
  labels:
    app: redis-cache-service
spec:
  to:
    kind: Service
    name: redis-cache-service
    weight: 100
  port:
    targetPort: http
