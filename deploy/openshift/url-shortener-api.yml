# Deploy with:
#   oc new-project python-samples    (if needed)
#   oc apply -f <filename>.yml
#   oc start-build <app-name>        (trigger the first build)
#   oc get builds                    (watch build progress)
#   oc get route <app-name>          (get the URL)
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: url-shortener-api
  labels:
    app: url-shortener-api
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: url-shortener-api
  labels:
    app: url-shortener-api
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/url-shortener-api
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: url-shortener-api:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-api
  labels:
    app: url-shortener-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-shortener-api
  template:
    metadata:
      labels:
        app: url-shortener-api
      annotations:
        image.openshift.io/triggers: >-
          [{"from":{"kind":"ImageStreamTag","name":"url-shortener-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"url-shortener-api\")].image"}]
    spec:
      containers:
        - name: url-shortener-api
          image: image-registry.openshift-image-registry.svc:5000/python-samples/url-shortener-api:latest
          ports:
            - name: http
              containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-api
  labels:
    app: url-shortener-api
spec:
  type: ClusterIP
  selector:
    app: url-shortener-api
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: url-shortener-api
  labels:
    app: url-shortener-api
spec:
  to:
    kind: Service
    name: url-shortener-api
    weight: 100
  port:
    targetPort: http
