# Apply to your OpenShift project, for example:
#   oc project <your-namespace>
#   oc apply -f auth-service-jwt.yml
# Or set metadata.namespace on each resource (uncomment and replace placeholder).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-jwt
  # namespace: <your-namespace>
  labels:
    app: auth-service-jwt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service-jwt
  template:
    metadata:
      labels:
        app: auth-service-jwt
    spec:
      containers:
        - name: auth-service-jwt
          image: auth-service-jwt:latest
          ports:
            - name: http
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-jwt
  # namespace: <your-namespace>
  labels:
    app: auth-service-jwt
spec:
  type: ClusterIP
  selector:
    app: auth-service-jwt
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: auth-service-jwt
  # namespace: <your-namespace>
  labels:
    app: auth-service-jwt
spec:
  to:
    kind: Service
    name: auth-service-jwt
    weight: 100
  port:
    targetPort: http
