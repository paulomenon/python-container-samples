# Deploy with:
#   oc new-project python-samples    (if needed)
#   oc apply -f distributed-web-scraper.yml
#   oc start-build coordinator
#   oc start-build worker
#   oc get builds                    (watch build progress)
#   oc get route                     (get the URL)
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: coordinator
  labels:
    app: distributed-web-scraper
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: worker
  labels:
    app: distributed-web-scraper
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: coordinator
  labels:
    app: distributed-web-scraper
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/distributed-web-scraper/coordinator
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: coordinator:latest
  triggers:
    - type: ConfigChange
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: worker
  labels:
    app: distributed-web-scraper
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/distributed-web-scraper/worker
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: worker:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: distributed-web-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributed-web-scraper
      component: redis
  template:
    metadata:
      labels:
        app: distributed-web-scraper
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: distributed-web-scraper
spec:
  type: ClusterIP
  selector:
    app: distributed-web-scraper
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  labels:
    app: distributed-web-scraper
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"coordinator:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"coordinator\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributed-web-scraper
      component: coordinator
  template:
    metadata:
      labels:
        app: distributed-web-scraper
        component: coordinator
    spec:
      containers:
        - name: coordinator
          image: coordinator:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  labels:
    app: distributed-web-scraper
spec:
  type: ClusterIP
  selector:
    app: distributed-web-scraper
    component: coordinator
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: coordinator
  labels:
    app: distributed-web-scraper
spec:
  to:
    kind: Service
    name: coordinator
    weight: 100
  port:
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: distributed-web-scraper
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"worker:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"worker\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributed-web-scraper
      component: worker
  template:
    metadata:
      labels:
        app: distributed-web-scraper
        component: worker
    spec:
      containers:
        - name: worker
          image: worker:latest
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
