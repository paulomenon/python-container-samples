# Apply to your OpenShift project, for example:
#   oc project <your-namespace>
#   oc apply -f distributed-web-scraper.yml
# Or set metadata.namespace on each resource (uncomment and replace placeholder).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  # namespace: <your-namespace>
  labels:
    app: distributed-web-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributed-web-scraper
      component: coordinator
  template:
    metadata:
      labels:
        app: distributed-web-scraper
        component: coordinator
    spec:
      containers:
        - name: coordinator
          image: distributed-web-scraper-coordinator:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  # namespace: <your-namespace>
  labels:
    app: distributed-web-scraper
spec:
  type: ClusterIP
  selector:
    app: distributed-web-scraper
    component: coordinator
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: coordinator
  # namespace: <your-namespace>
  labels:
    app: distributed-web-scraper
spec:
  to:
    kind: Service
    name: coordinator
    weight: 100
  port:
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  # namespace: <your-namespace>
  labels:
    app: distributed-web-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributed-web-scraper
      component: worker
  template:
    metadata:
      labels:
        app: distributed-web-scraper
        component: worker
    spec:
      containers:
        - name: worker
          image: distributed-web-scraper-worker:latest
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  # namespace: <your-namespace>
  labels:
    app: distributed-web-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributed-web-scraper
      component: redis
  template:
    metadata:
      labels:
        app: distributed-web-scraper
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  # namespace: <your-namespace>
  labels:
    app: distributed-web-scraper
spec:
  type: ClusterIP
  selector:
    app: distributed-web-scraper
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
