# Deploy with:
#   oc new-project python-samples    (if needed)
#   oc apply -f api-gateway-backend.yml
#   oc start-build gateway
#   oc start-build backend-users
#   oc start-build backend-products
#   oc get builds                    (watch build progress)
#   oc get route                     (get the URL)
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: gateway
  labels:
    app: api-gateway-backend
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: backend-users
  labels:
    app: api-gateway-backend
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: backend-products
  labels:
    app: api-gateway-backend
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: gateway
  labels:
    app: api-gateway-backend
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/api-gateway-backend/gateway
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: gateway:latest
  triggers:
    - type: ConfigChange
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: backend-users
  labels:
    app: api-gateway-backend
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/api-gateway-backend/backend-users
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: backend-users:latest
  triggers:
    - type: ConfigChange
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: backend-products
  labels:
    app: api-gateway-backend
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/api-gateway-backend/backend-products
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: backend-products:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: api-gateway-backend
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"gateway:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"gateway\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-backend
      component: gateway
  template:
    metadata:
      labels:
        app: api-gateway-backend
        component: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: BACKEND_USERS_URL
              value: http://backend-users:8001
            - name: BACKEND_PRODUCTS_URL
              value: http://backend-products:8002
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: api-gateway-backend
spec:
  type: ClusterIP
  selector:
    app: api-gateway-backend
    component: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gateway
  labels:
    app: api-gateway-backend
spec:
  to:
    kind: Service
    name: gateway
    weight: 100
  port:
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-users
  labels:
    app: api-gateway-backend
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"backend-users:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"backend-users\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-backend
      component: backend-users
  template:
    metadata:
      labels:
        app: api-gateway-backend
        component: backend-users
    spec:
      containers:
        - name: backend-users
          image: backend-users:latest
          ports:
            - name: http
              containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: backend-users
  labels:
    app: api-gateway-backend
spec:
  type: ClusterIP
  selector:
    app: api-gateway-backend
    component: backend-users
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-products
  labels:
    app: api-gateway-backend
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"backend-products:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"backend-products\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-backend
      component: backend-products
  template:
    metadata:
      labels:
        app: api-gateway-backend
        component: backend-products
    spec:
      containers:
        - name: backend-products
          image: backend-products:latest
          ports:
            - name: http
              containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: backend-products
  labels:
    app: api-gateway-backend
spec:
  type: ClusterIP
  selector:
    app: api-gateway-backend
    component: backend-products
  ports:
    - name: http
      port: 8002
      targetPort: http
