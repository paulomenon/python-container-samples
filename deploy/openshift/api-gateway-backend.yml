# Apply to your OpenShift project, for example:
#   oc project <your-namespace>
#   oc apply -f api-gateway-backend.yml
# Or set metadata.namespace on each resource (uncomment and replace placeholder).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  # namespace: <your-namespace>
  labels:
    app: api-gateway-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-backend
      component: gateway
  template:
    metadata:
      labels:
        app: api-gateway-backend
        component: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: BACKEND_USERS_URL
              value: http://backend-users:8001
            - name: BACKEND_PRODUCTS_URL
              value: http://backend-products:8002
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  # namespace: <your-namespace>
  labels:
    app: api-gateway-backend
spec:
  type: ClusterIP
  selector:
    app: api-gateway-backend
    component: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gateway
  # namespace: <your-namespace>
  labels:
    app: api-gateway-backend
spec:
  to:
    kind: Service
    name: gateway
    weight: 100
  port:
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-users
  # namespace: <your-namespace>
  labels:
    app: api-gateway-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-backend
      component: backend-users
  template:
    metadata:
      labels:
        app: api-gateway-backend
        component: backend-users
    spec:
      containers:
        - name: backend-users
          image: backend-users:latest
          ports:
            - name: http
              containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: backend-users
  # namespace: <your-namespace>
  labels:
    app: api-gateway-backend
spec:
  type: ClusterIP
  selector:
    app: api-gateway-backend
    component: backend-users
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-products
  # namespace: <your-namespace>
  labels:
    app: api-gateway-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-backend
      component: backend-products
  template:
    metadata:
      labels:
        app: api-gateway-backend
        component: backend-products
    spec:
      containers:
        - name: backend-products
          image: backend-products:latest
          ports:
            - name: http
              containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: backend-products
  # namespace: <your-namespace>
  labels:
    app: api-gateway-backend
spec:
  type: ClusterIP
  selector:
    app: api-gateway-backend
    component: backend-products
  ports:
    - name: http
      port: 8002
      targetPort: http
