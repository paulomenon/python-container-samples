# Deploy with:
#   oc new-project python-samples    (if needed)
#   oc apply -f <filename>.yml
#   oc start-build <app-name>        (trigger the first build)
#   oc get builds                    (watch build progress)
#   oc get route <app-name>          (get the URL)
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: env-config-app
  labels:
    app: env-config-app
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: env-config-app
  labels:
    app: env-config-app
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/env-config-app
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: env-config-app:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-config-app
  labels:
    app: env-config-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: env-config-app
  template:
    metadata:
      labels:
        app: env-config-app
      annotations:
        image.openshift.io/triggers: >-
          [{"from":{"kind":"ImageStreamTag","name":"env-config-app:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"env-config-app\")].image"}]
    spec:
      containers:
        - name: env-config-app
          image: image-registry.openshift-image-registry.svc:5000/python-samples/env-config-app:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_NAME
              value: env-config-app
            - name: APP_ENV
              value: production
---
apiVersion: v1
kind: Service
metadata:
  name: env-config-app
  labels:
    app: env-config-app
spec:
  type: ClusterIP
  selector:
    app: env-config-app
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: env-config-app
  labels:
    app: env-config-app
spec:
  to:
    kind: Service
    name: env-config-app
    weight: 100
  port:
    targetPort: http
