# Apply to your OpenShift project, for example:
#   oc project <your-namespace>
#   oc apply -f env-config-app.yml
# Or set metadata.namespace on each resource (uncomment and replace placeholder).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-config-app
  # namespace: <your-namespace>
  labels:
    app: env-config-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: env-config-app
  template:
    metadata:
      labels:
        app: env-config-app
    spec:
      containers:
        - name: env-config-app
          image: env-config-app:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_NAME
              value: env-config-app
            - name: APP_ENV
              value: production
---
apiVersion: v1
kind: Service
metadata:
  name: env-config-app
  # namespace: <your-namespace>
  labels:
    app: env-config-app
spec:
  type: ClusterIP
  selector:
    app: env-config-app
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: env-config-app
  # namespace: <your-namespace>
  labels:
    app: env-config-app
spec:
  to:
    kind: Service
    name: env-config-app
    weight: 100
  port:
    targetPort: http
