# Apply to your OpenShift project, for example:
#   oc project <your-namespace>
#   oc apply -f file-upload-service.yml
# Or set metadata.namespace on each resource (uncomment and replace placeholder).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-upload-service
  # namespace: <your-namespace>
  labels:
    app: file-upload-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-upload-service
  template:
    metadata:
      labels:
        app: file-upload-service
    spec:
      containers:
        - name: file-upload-service
          image: file-upload-service:latest
          ports:
            - name: http
              containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: file-upload-service
  # namespace: <your-namespace>
  labels:
    app: file-upload-service
spec:
  type: ClusterIP
  selector:
    app: file-upload-service
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: file-upload-service
  # namespace: <your-namespace>
  labels:
    app: file-upload-service
spec:
  to:
    kind: Service
    name: file-upload-service
    weight: 100
  port:
    targetPort: http
