# Deploy with:
#   oc new-project python-samples    (if needed)
#   oc apply -f <filename>.yml
#   oc start-build <app-name>        (trigger the first build)
#   oc get builds                    (watch build progress)
#   oc get route <app-name>          (get the URL)
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: fastapi-microservice
  labels:
    app: fastapi-microservice
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: fastapi-microservice
  labels:
    app: fastapi-microservice
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/fastapi-microservice
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: fastapi-microservice:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-microservice
  labels:
    app: fastapi-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-microservice
  template:
    metadata:
      labels:
        app: fastapi-microservice
      annotations:
        image.openshift.io/triggers: >-
          [{"from":{"kind":"ImageStreamTag","name":"fastapi-microservice:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"fastapi-microservice\")].image"}]
    spec:
      containers:
        - name: fastapi-microservice
          image: image-registry.openshift-image-registry.svc:5000/python-samples/fastapi-microservice:latest
          ports:
            - name: http
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-microservice
  labels:
    app: fastapi-microservice
spec:
  type: ClusterIP
  selector:
    app: fastapi-microservice
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fastapi-microservice
  labels:
    app: fastapi-microservice
spec:
  to:
    kind: Service
    name: fastapi-microservice
    weight: 100
  port:
    targetPort: http
