# Apply to your OpenShift project, for example:
#   oc project <your-namespace>
#   oc apply -f microservices-app.yml
# Or set metadata.namespace on each resource (uncomment and replace placeholder).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  # namespace: <your-namespace>
  labels:
    app: microservices-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservices-app
      component: api-gateway
  template:
    metadata:
      labels:
        app: microservices-app
        component: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: SERVICE_USER_URL
              value: http://user-service:5001
            - name: SERVICE_ORDER_URL
              value: http://order-service:5002
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  # namespace: <your-namespace>
  labels:
    app: microservices-app
spec:
  type: ClusterIP
  selector:
    app: microservices-app
    component: api-gateway
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api-gateway
  # namespace: <your-namespace>
  labels:
    app: microservices-app
spec:
  to:
    kind: Service
    name: api-gateway
    weight: 100
  port:
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  # namespace: <your-namespace>
  labels:
    app: microservices-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservices-app
      component: user-service
  template:
    metadata:
      labels:
        app: microservices-app
        component: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          ports:
            - name: http
              containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  # namespace: <your-namespace>
  labels:
    app: microservices-app
spec:
  type: ClusterIP
  selector:
    app: microservices-app
    component: user-service
  ports:
    - name: http
      port: 5001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  # namespace: <your-namespace>
  labels:
    app: microservices-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservices-app
      component: order-service
  template:
    metadata:
      labels:
        app: microservices-app
        component: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          ports:
            - name: http
              containerPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  # namespace: <your-namespace>
  labels:
    app: microservices-app
spec:
  type: ClusterIP
  selector:
    app: microservices-app
    component: order-service
  ports:
    - name: http
      port: 5002
      targetPort: http
