# Deploy with:
#   oc new-project python-samples    (if needed)
#   oc apply -f microservices-app.yml
#   oc start-build api-gateway
#   oc start-build user-service
#   oc start-build order-service
#   oc get builds                    (watch build progress)
#   oc get route                     (get the URL)
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: api-gateway
  labels:
    app: microservices-app
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: user-service
  labels:
    app: microservices-app
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: order-service
  labels:
    app: microservices-app
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: api-gateway
  labels:
    app: microservices-app
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/microservices-app/api-gateway
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: api-gateway:latest
  triggers:
    - type: ConfigChange
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: user-service
  labels:
    app: microservices-app
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/microservices-app/user-service
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: user-service:latest
  triggers:
    - type: ConfigChange
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: order-service
  labels:
    app: microservices-app
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/microservices-app/order-service
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: order-service:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: microservices-app
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"api-gateway:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"api-gateway\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservices-app
      component: api-gateway
  template:
    metadata:
      labels:
        app: microservices-app
        component: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: SERVICE_USER_URL
              value: http://user-service:5001
            - name: SERVICE_ORDER_URL
              value: http://order-service:5002
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: microservices-app
spec:
  type: ClusterIP
  selector:
    app: microservices-app
    component: api-gateway
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api-gateway
  labels:
    app: microservices-app
spec:
  to:
    kind: Service
    name: api-gateway
    weight: 100
  port:
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: microservices-app
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"user-service:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"user-service\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservices-app
      component: user-service
  template:
    metadata:
      labels:
        app: microservices-app
        component: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          ports:
            - name: http
              containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app: microservices-app
spec:
  type: ClusterIP
  selector:
    app: microservices-app
    component: user-service
  ports:
    - name: http
      port: 5001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: microservices-app
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"order-service:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"order-service\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservices-app
      component: order-service
  template:
    metadata:
      labels:
        app: microservices-app
        component: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          ports:
            - name: http
              containerPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: microservices-app
spec:
  type: ClusterIP
  selector:
    app: microservices-app
    component: order-service
  ports:
    - name: http
      port: 5002
      targetPort: http
