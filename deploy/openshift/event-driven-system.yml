# Apply to your OpenShift project, for example:
#   oc project <your-namespace>
#   oc apply -f event-driven-system.yml
# Or set metadata.namespace on each resource (uncomment and replace placeholder).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  # namespace: <your-namespace>
  labels:
    app: event-driven-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-driven-system
      component: producer
  template:
    metadata:
      labels:
        app: event-driven-system
        component: producer
    spec:
      containers:
        - name: producer
          image: event-driven-system-producer:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
---
apiVersion: v1
kind: Service
metadata:
  name: producer
  # namespace: <your-namespace>
  labels:
    app: event-driven-system
spec:
  type: ClusterIP
  selector:
    app: event-driven-system
    component: producer
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: producer
  # namespace: <your-namespace>
  labels:
    app: event-driven-system
spec:
  to:
    kind: Service
    name: producer
    weight: 100
  port:
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  # namespace: <your-namespace>
  labels:
    app: event-driven-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-driven-system
      component: consumer
  template:
    metadata:
      labels:
        app: event-driven-system
        component: consumer
    spec:
      containers:
        - name: consumer
          image: event-driven-system-consumer:latest
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  # namespace: <your-namespace>
  labels:
    app: event-driven-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-driven-system
      component: redis
  template:
    metadata:
      labels:
        app: event-driven-system
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  # namespace: <your-namespace>
  labels:
    app: event-driven-system
spec:
  type: ClusterIP
  selector:
    app: event-driven-system
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
