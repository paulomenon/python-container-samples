# Apply to your OpenShift project, for example:
#   oc project <your-namespace>
#   oc apply -f logging-monitoring-app.yml
# Or set metadata.namespace on each resource (uncomment and replace placeholder).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-monitoring-app
  # namespace: <your-namespace>
  labels:
    app: logging-monitoring-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging-monitoring-app
  template:
    metadata:
      labels:
        app: logging-monitoring-app
    spec:
      containers:
        - name: logging-monitoring-app
          image: logging-monitoring-app:latest
          ports:
            - name: http
              containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: logging-monitoring-app
  # namespace: <your-namespace>
  labels:
    app: logging-monitoring-app
spec:
  type: ClusterIP
  selector:
    app: logging-monitoring-app
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: logging-monitoring-app
  # namespace: <your-namespace>
  labels:
    app: logging-monitoring-app
spec:
  to:
    kind: Service
    name: logging-monitoring-app
    weight: 100
  port:
    targetPort: http
