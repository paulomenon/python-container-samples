# Deploy with:
#   oc new-project python-samples    (if needed)
#   oc apply -f <filename>.yml
#   oc start-build <app-name>        (trigger the first build)
#   oc get builds                    (watch build progress)
#   oc get route <app-name>          (get the URL)
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: health-check-endpoint
  labels:
    app: health-check-endpoint
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: health-check-endpoint
  labels:
    app: health-check-endpoint
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/health-check-endpoint
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: health-check-endpoint:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-check-endpoint
  labels:
    app: health-check-endpoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-check-endpoint
  template:
    metadata:
      labels:
        app: health-check-endpoint
      annotations:
        image.openshift.io/triggers: >-
          [{"from":{"kind":"ImageStreamTag","name":"health-check-endpoint:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"health-check-endpoint\")].image"}]
    spec:
      containers:
        - name: health-check-endpoint
          image: image-registry.openshift-image-registry.svc:5000/python-samples/health-check-endpoint:latest
          ports:
            - name: http
              containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: health-check-endpoint
  labels:
    app: health-check-endpoint
spec:
  type: ClusterIP
  selector:
    app: health-check-endpoint
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: health-check-endpoint
  labels:
    app: health-check-endpoint
spec:
  to:
    kind: Service
    name: health-check-endpoint
    weight: 100
  port:
    targetPort: http
