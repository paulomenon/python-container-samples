# Deploy with:
#   oc new-project python-samples    (if needed)
#   oc apply -f <filename>.yml
#   oc start-build <app-name>        (trigger the first build)
#   oc get builds                    (watch build progress)
#   oc get route <app-name>          (get the URL)
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: autoscaling-api
  labels:
    app: autoscaling-api
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: autoscaling-api
  labels:
    app: autoscaling-api
spec:
  source:
    type: Git
    git:
      uri: https://github.com/paulomenon/python-container-samples.git
      ref: main
    contextDir: apps/autoscaling-api
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: autoscaling-api:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaling-api
  labels:
    app: autoscaling-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoscaling-api
  template:
    metadata:
      labels:
        app: autoscaling-api
      annotations:
        image.openshift.io/triggers: >-
          [{"from":{"kind":"ImageStreamTag","name":"autoscaling-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"autoscaling-api\")].image"}]
    spec:
      containers:
        - name: autoscaling-api
          image: image-registry.openshift-image-registry.svc:5000/python-samples/autoscaling-api:latest
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: autoscaling-api
  labels:
    app: autoscaling-api
spec:
  type: ClusterIP
  selector:
    app: autoscaling-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: autoscaling-api
  labels:
    app: autoscaling-api
spec:
  to:
    kind: Service
    name: autoscaling-api
    weight: 100
  port:
    targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autoscaling-api
  labels:
    app: autoscaling-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autoscaling-api
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
