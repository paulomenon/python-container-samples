version: "3.8"

services:
  api:
    build: ../../apps/task-queue-worker
    ports:
      - "5000:5000"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  worker:
    build: ../../apps/task-queue-worker
    command: ["rq", "worker", "--url", "redis://redis:6379"]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
