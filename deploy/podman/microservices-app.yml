version: "3.8"

services:
  api-gateway:
    build: ../../apps/microservices-app/api-gateway
    ports:
      - "5000:5000"
    environment:
      SERVICE_USER_URL: http://user-service:5001
      SERVICE_ORDER_URL: http://order-service:5002

  user-service:
    build: ../../apps/microservices-app/user-service
    ports:
      - "5001:5001"

  order-service:
    build: ../../apps/microservices-app/order-service
    ports:
      - "5002:5002"
